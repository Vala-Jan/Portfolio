<main>
  <section class="section" style="padding-top: 1.5rem;">
    <div class="section__head" style="justify-content: center; text-align: center;">
      <h2 class="mono-file">Profesní CV</h2>
    </div>
    <div id="cvPages" class="cv__pages" aria-label="Životopis Jan Vala"></div>
    <p class="cv__dl"><a id="cvDownload" href="uploads/CV-JanVala.pdf" download="CV_JanVala.pdf">Stáhnout CV (PDF)</a></p>
  </section>
</main>
<script type="module">
import * as pdfjs from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";
const SRC = "uploads/CV-JanVala.pdf";
const host = document.getElementById("cvPages");
document.getElementById("cvDownload").addEventListener("click", async (e) => {
  e.preventDefault();
  try {
    const blob = await (await fetch(SRC)).blob();
    const url = URL.createObjectURL(new Blob([blob], { type: "application/pdf" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "CV_JanVala.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) {
    window.location.href = SRC;
  }
});
try {
  const buf = await (await fetch(SRC)).arrayBuffer();
  const doc = await pdfjs.getDocument({ data: new Uint8Array(buf) }).promise;
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: 2 });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    c.className = "cv__page";
    host.appendChild(c);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  }
} catch (err) {
  host.textContent = "CV se nepodařilo načíst.";
  console.warn(err);
}
</script>

</body>
